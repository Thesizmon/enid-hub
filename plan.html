<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐺 Enid's Weekly Planner</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep:#3A3A5E;
  --lavender:#B9A5E2;
  --muted:#9B92B8;
  --text:#2D2044;
  --bg-grad:linear-gradient(135deg,#F2EEFF 0%,#FFF0FA 55%,#EEF4FF 100%);
  --cell:56px;
  --cols:52px repeat(7,minmax(90px,1fr));
}
body{font-family:'Nunito',sans-serif;background:var(--bg-grad);color:var(--text);min-height:100vh}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:999;background:var(--bg-grad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s ease}
#loader.hidden{opacity:0;pointer-events:none}
.loader-wrap{position:relative;width:100px;height:100px;display:flex;align-items:center;justify-content:center}
.loader-nails-img{width:64px;height:64px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sp{position:absolute;font-size:12px;color:var(--lavender);animation:orbit 2.4s linear infinite}
.sp1{top:4px;left:50%;animation-delay:0s}
.sp2{top:20%;right:4px;animation-delay:-.48s}
.sp3{bottom:10%;right:10%;animation-delay:-.96s}
.sp4{bottom:4px;left:30%;animation-delay:-1.44s}
.sp5{top:20%;left:4px;animation-delay:-1.92s}
@keyframes orbit{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.loader-text{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.03em}

/* ── HEADER ── */
.header{background:var(--deep);color:#fff;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 18px 18px;box-shadow:0 4px 24px rgba(58,58,94,.35);gap:12px;flex-wrap:wrap}
.brand{font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:9px}
.back-link{color:rgba(255,255,255,.7);text-decoration:none;font-size:.72rem;font-weight:700;transition:color .2s}
.back-link:hover{color:#fff}
.week-lbl{font-size:.84rem;font-weight:700;opacity:.82}
.navs{display:flex;gap:6px}
.nb{background:rgba(255,255,255,.13);border:none;color:#fff;border-radius:9px;padding:5px 13px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.77rem;font-weight:800;transition:background .2s}
.nb:hover{background:rgba(255,255,255,.24)}
.nb.today-btn{background:rgba(185,165,226,.28)}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:3px;background:rgba(0,0,0,.18);border-radius:10px;padding:2px}
.vt-btn{background:transparent;border:none;color:rgba(255,255,255,.55);border-radius:8px;padding:4px 14px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;transition:all .2s}
.vt-btn.active{background:rgba(255,255,255,.22);color:#fff}
.vt-btn:hover:not(.active){color:rgba(255,255,255,.8)}

/* ── MONTH GRID ── */
.month-wrap{padding:10px 16px 40px}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:600px}
.month-hdr{text-align:center;font-size:.62rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:6px 0}
.month-hdr.wknd{opacity:.5}
.month-cell{min-height:95px;background:rgba(255,255,255,.55);border-radius:12px;padding:6px 7px;cursor:pointer;transition:transform .14s,box-shadow .14s;border:1.5px solid rgba(185,165,226,.12);position:relative;overflow:hidden}
.month-cell:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(58,58,94,.12)}
.month-cell.today{border-color:var(--deep);box-shadow:0 0 0 2px rgba(58,58,94,.2)}
.month-cell.other-month{opacity:.35;background:rgba(255,255,255,.25)}
.month-cell.weekend{background:rgba(255,215,240,.2)}
.month-cell-date{font-size:.82rem;font-weight:900;color:var(--text);margin-bottom:4px;line-height:1}
.month-cell.today .month-cell-date{width:26px;height:26px;background:var(--deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem}
.month-pill{display:flex;align-items:center;gap:4px;font-size:.56rem;font-weight:700;color:var(--text);padding:1.5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.month-pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.month-more{font-size:.52rem;font-weight:800;color:var(--muted);margin-top:1px}

/* ── LEGEND ── */
.legend{padding:12px 20px 4px}
.legend-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.legend-label{font-size:.62rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-right:2px}
.lc{padding:4px 11px;border-radius:20px;font-size:.68rem;font-weight:800}
.lc.t2{padding:3px 10px;font-size:.64rem;opacity:.92}

/* ── QUICK ADD ── */
.quick-add{padding:4px 20px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qa-label{font-size:.65rem;font-weight:900;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
.qa-divider{width:1px;height:18px;background:rgba(185,165,226,.35);margin:0 2px}
.qa-btn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;border:none;font-family:'Nunito',sans-serif;font-size:.71rem;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qa-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.13)}
.qa-btn.t2{padding:4px 11px;font-size:.67rem;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.qa-btn.t2:hover{box-shadow:0 3px 10px rgba(0,0,0,.11)}

/* ── AI BAR ── */
.ai-wrap{padding:0 20px 10px}
.ai-bar{background:rgba(255,255,255,.75);border-radius:12px;border:1.5px solid rgba(185,165,226,.4);display:flex;align-items:center;gap:8px;padding:9px 14px;box-shadow:0 2px 14px rgba(185,165,226,.18)}
.ai-icon{font-size:1rem}
.ai-input{flex:1;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:700;color:var(--text);outline:none;min-width:0}
.ai-input::placeholder{color:var(--muted)}
.ai-send{background:var(--deep);color:#fff;border:none;border-radius:8px;padding:5px 13px;font-size:.7rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap}
.ai-resp{background:rgba(185,165,226,.2);border-radius:10px;padding:8px 14px;font-size:.73rem;font-weight:700;color:var(--deep);display:none;margin-top:6px;border-left:3px solid var(--lavender);white-space:pre-wrap;line-height:1.5}

/* ── PLANNER ── */
.planner-scroll{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 260px);padding:0 16px 40px}
.planner{min-width:720px}

/* ── DAY HEADERS ── */
.head-row{display:grid;grid-template-columns:var(--cols);position:sticky;top:0;z-index:20;background:var(--bg-grad);padding:10px 0 6px;margin-bottom:2px}
.th-day{text-align:center;padding:4px 2px 8px;font-size:.62rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.dn{display:block;font-size:1.2rem;font-weight:900;color:var(--text);margin-top:2px;line-height:1}
.today-wrap .dn{width:34px;height:34px;background:var(--deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto 0;font-size:1rem}
.wknd-dim{opacity:.5}
.sub-mo{font-size:.55rem;color:var(--muted);display:block;margin-top:1px}

/* ── BODY GRID ── */
.body-grid{display:grid;grid-template-columns:var(--cols)}
.tlbl{height:var(--cell);display:flex;align-items:flex-start;padding:3px 8px 0 0;justify-content:flex-end;font-size:.59rem;color:var(--muted);font-weight:700;white-space:nowrap}

/* ── DAY COLS ── */
.dcol{position:relative;border-left:1px solid rgba(185,165,226,.22)}
.wknd-col{background:rgba(255,215,240,.04)}
.hcell{height:var(--cell);border-top:1px solid rgba(185,165,226,.13);cursor:pointer;transition:background .13s}
.hcell:hover{background:rgba(185,165,226,.09)}
.hr8-line{position:absolute;left:0;right:0;height:1.5px;background:rgba(185,165,226,.35);pointer-events:none;z-index:2}
.hr8-label{position:absolute;right:4px;font-size:.52rem;font-weight:900;color:rgba(185,165,226,.6);pointer-events:none;z-index:2;letter-spacing:.04em}

/* ── EVENTS ── */
.ev{position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 8px;font-size:.66rem;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.13);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;z-index:3;transition:transform .14s,box-shadow .14s,opacity .22s}
.ev:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.2)}
.et{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.68rem}
.em{font-size:.57rem;opacity:.8;font-weight:700}
.rm{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.2);border:none;color:inherit;border-radius:5px;padding:2px 7px;font-size:.56rem;cursor:pointer;font-weight:900;line-height:1.5;font-family:'Nunito',sans-serif;transition:background .17s}
.rm:hover{background:rgba(255,255,255,.42)}

/* ── FREE HINT ── */
.free-hint{position:absolute;left:3px;right:3px;border-radius:10px;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(185,165,226,.07) 0%,rgba(255,220,245,.04) 100%);border:1px solid rgba(185,165,226,.1)}

/* ── NOW LINE ── */
.now-line{position:absolute;left:0;right:0;height:2.5px;background:linear-gradient(90deg,#FF6B9D,#FFB3D1);z-index:8;pointer-events:none;border-radius:2px}
.now-dot{position:absolute;left:-5px;top:-4.5px;width:11px;height:11px;background:#FF6B9D;border-radius:50%;box-shadow:0 0 8px rgba(255,107,157,.6)}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(45,32,68,.35);z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px;width:340px;box-shadow:0 8px 40px rgba(58,58,94,.25);position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:1rem;font-weight:900;color:var(--deep);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal label{display:block;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;margin-top:12px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal select,.modal textarea{width:100%;border:1.5px solid rgba(185,165,226,.5);border-radius:8px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:.78rem;font-weight:700;color:var(--text);outline:none;transition:border .18s;background:#FDFBFF}
.modal input:focus,.modal select:focus{border-color:var(--lavender)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-save{flex:1;border:none;border-radius:10px;padding:9px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;cursor:pointer;transition:opacity .2s;color:#fff}
.modal-save:hover{opacity:.88}
.modal-cancel{background:#f0ebff;color:var(--muted);border:none;border-radius:10px;padding:9px 16px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;cursor:pointer}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted);line-height:1}
.early-notice{background:#FFF3CD;border:1px solid #FFD966;border-radius:8px;padding:7px 10px;font-size:.67rem;font-weight:700;color:#7A5800;margin-top:8px;display:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--deep);color:#fff;padding:9px 22px;border-radius:13px;font-size:.75rem;font-weight:700;box-shadow:0 4px 22px rgba(58,58,94,.35);transition:transform .28s cubic-bezier(.34,1.56,.64,1);z-index:99;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

// ── DATE HELPERS ──
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function formatWeekLabel(monday) {
  const sun = addDays(monday, 6);
  const m1 = MONTH_NAMES[monday.getMonth()];
  const m2 = MONTH_NAMES[sun.getMonth()];
  const label = monday.getMonth() === sun.getMonth()
    ? `${m1} ${monday.getDate()} – ${sun.getDate()}, ${monday.getFullYear()}`
    : `${m1} ${monday.getDate()} – ${m2} ${sun.getDate()}, ${sun.getFullYear()}`;
  return label;
}

function parseTime(str) {
  const [h, m] = str.split(':').map(Number);
  return { h, m };
}

function fmtTime(str) {
  const { h, m } = parseTime(str);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function isToday(date) {
  const now = new Date();
  return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
}

function getTodayDayIndex() {
  const now = new Date();
  const mon = getMondayOf(now);
  if (toISODate(mon) !== toISODate(currentMonday)) return -1;
  const day = now.getDay();
  return day === 0 ? 6 : day - 1;
}

  const scroll = document.getElementById('plannerScroll');
  const target = Math.max(0, (h - GRID_START - buffer) * CELL);
  scroll.scrollTo({ top: target, behavior: 'smooth' });
}

// ── BUILD GRID STRUCTURE ──
function buildGrid() {
  // Header row
  const headRow = document.getElementById('headRow');
  headRow.innerHTML = '<div></div>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(currentMonday, i);
    const isWknd = i >= 5;
    const isTodayCol = isToday(d);
    const div = document.createElement('div');
    div.className = 'th-day' + (isWknd ? ' wknd-dim' : '') + (isTodayCol ? ' today-wrap' : '');
    div.innerHTML = `${DAY_NAMES_SHORT[i]}<span class="dn">${d.getDate()}</span><span class="sub-mo">${MONTH_NAMES[d.getMonth()]}</span>`;
    headRow.appendChild(div);
  }

  // Body grid
  const bodyGrid = document.getElementById('bodyGrid');
  bodyGrid.innerHTML = '';

  // Time labels column
  const tcol = document.createElement('div');
  tcol.id = 'tcol';
  for (let i = 0; i < HOURS; i++) {
    const h = GRID_START + i;
    const label = h === 0 ? '12 AM' : h < 12 ? h + ' AM' : h === 12 ? '12 PM' : (h - 12) + ' PM';
    const el = document.createElement('div');
    el.className = 'tlbl';
    el.textContent = label;
    tcol.appendChild(el);
  }
  bodyGrid.appendChild(tcol);

  // Day columns
  for (let di = 0; di < 7; di++) {
    const col = document.createElement('div');
    col.className = 'dcol' + (di >= 5 ? ' wknd-col' : '');
    col.id = 'c' + di;
    col.style.height = (HOURS * CELL) + 'px';
    col.style.position = 'relative';

    for (let i = 0; i < HOURS; i++) {
      const c = document.createElement('div');
      c.className = 'hcell';
      c.onclick = () => toast('Use Quick Add above to add events here ✦');
      col.appendChild(c);
    }

    // 8 AM marker line
    const marker = document.createElement('div');
    marker.className = 'hr8-line';
    marker.style.top = T(8) + 'px';
    col.appendChild(marker);

    if (di === 0) {
      const mlbl = document.createElement('div');
      mlbl.className = 'hr8-label';
      mlbl.style.top = (T(8) - 13) + 'px';
      mlbl.textContent = '8 AM ↓';
      col.appendChild(mlbl);
    }

    bodyGrid.appendChild(col);
  }
}

// ── RENDER EVENT ON GRID ──
function renderEvent(ev) {
  if (ev.is_hidden) return;
  const col = document.getElementById('c' + ev.day_index);
  if (!col) return;

  const cat = CATEGORIES[ev.category] || CATEGORIES.other;
  const { h: sh, m: sm } = parseTime(ev.start_time);
  const { h: eh, m: em } = parseTime(ev.end_time);
  const topPx = T(sh, sm);
  const heightPx = H(sh, sm, eh, em);

  const el = document.createElement('div');
  el.className = 'ev';
  el.style.cssText = `top:${topPx}px;height:${heightPx}px;background:${cat.bg};color:${cat.tc}`;
  el.dataset.eventId = ev.id;

  const subtitle = ev.subtitle || `${fmtTime(ev.start_time)} – ${fmtTime(ev.end_time)}`;
  const isRecurring = ev.category === 'bbs' || ev.category === 'bowling';

  el.innerHTML = `<span class="et">${cat.icon} ${ev.title}</span><span class="em">${subtitle}</span>`;

  const rmBtn = document.createElement('button');
  rmBtn.className = 'rm';
  rmBtn.textContent = isRecurring ? '✕ hide' : '✕';
  rmBtn.onclick = async (e) => {
    e.stopPropagation();
    if (isRecurring) {
      await sb.from('planner_events').update({ is_hidden: true }).eq('id', ev.id);
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 220);
      toast(`${cat.icon} ${ev.title} hidden`);
    } else {
      await sb.from('planner_events').delete().eq('id', ev.id);
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 220);
      toast('Removed ✓');
    }
    weekEvents = weekEvents.filter(e => e.id !== ev.id);
    renderFreeTimeHints();
  };
  el.appendChild(rmBtn);
  col.appendChild(el);
}

// ── FREE TIME HINTS ──
function renderFreeTimeHints() {
  document.querySelectorAll('.free-hint').forEach(el => el.remove());

  for (let di = 0; di < 7; di++) {
    const col = document.getElementById('c' + di);
    if (!col) continue;

    const dayEvents = weekEvents.filter(e => e.day_index === di && !e.is_hidden);
    let freeStart;

    if (dayEvents.length === 0) {
      freeStart = GRID_START;
    } else {
      let latestEnd = 0;
      dayEvents.forEach(ev => {
        const { h, m } = parseTime(ev.end_time);
        const totalMins = h * 60 + m;
        if (totalMins > latestEnd) latestEnd = totalMins;
      });
      freeStart = latestEnd / 60;
    }

    const gridEnd = GRID_START + HOURS;
    if (freeStart < gridEnd) {
      const freeHeight = (gridEnd - freeStart) * CELL;
      if (freeHeight > CELL) {
        const fh = document.createElement('div');
        fh.className = 'free-hint';
        fh.style.top = T(Math.floor(freeStart), (freeStart % 1) * 60) + 'px';
        fh.style.height = freeHeight + 'px';
        col.appendChild(fh);
      }
    }
  }
}

// ── NOW LINE ──
function renderNowLine() {
  document.querySelectorAll('.now-line').forEach(el => el.remove());
  const todayIdx = getTodayDayIndex();
  if (todayIdx < 0) return;

  const col = document.getElementById('c' + todayIdx);
  if (!col) return;

  const now = new Date();
  const nh = now.getHours() + now.getMinutes() / 60;
  if (nh < GRID_START || nh >= GRID_START + HOURS) return;

  const nl = document.createElement('div');
  nl.className = 'now-line';
  nl.style.top = T(now.getHours(), now.getMinutes()) + 'px';
  nl.innerHTML = '<div class="now-dot"></div>';
  col.appendChild(nl);
}

function startNowLine() {
  if (nowLineInterval) clearInterval(nowLineInterval);
  renderNowLine();
  nowLineInterval = setInterval(renderNowLine, 60000);
}

// ── PRE-POPULATE RECURRING EVENTS ──
async function ensureRecurringEvents(weekStart) {
  const { data: existing } = await sb.from('planner_events')
    .select('day_index, category')
    .eq('week_start', weekStart);

  const existingSet = new Set((existing || []).map(e => `${e.category}:${e.day_index}`));
  const toInsert = [];

  // BBS Mon-Fri
  for (let di = 0; di <= 4; di++) {
    if (!existingSet.has(`bbs:${di}`)) {
      toInsert.push({
        week_start: weekStart,
        day_index: di,
        category: 'bbs',
        title: 'BBS Agency',
        subtitle: '9:00 AM – 5:00 PM',
        start_time: '09:00',
        end_time: '17:00',
        is_recurring: true,
        recurring_rule: 'weekly:mon,tue,wed,thu,fri',
      });
    }
  }

  // Bowling
  const bowlingWeek = BOWLING_CONFIG.find(c => c.weekStart === weekStart);
  if (bowlingWeek) {
    bowlingWeek.days.forEach(di => {
      if (!existingSet.has(`bowling:${di}`)) {
        toInsert.push({
          week_start: weekStart,
          day_index: di,
          category: 'bowling',
          title: 'Bowling League',
          subtitle: '6:15 PM – 9:00 PM',
          start_time: '18:15',
          end_time: '21:00',
          is_recurring: true,
          recurring_rule: 'weekly:seasonal',
        });
      }
    });
  }

  if (toInsert.length > 0) {
    await sb.from('planner_events').insert(toInsert);
  }
}

// ── LOAD WEEK ──
async function loadWeek() {
  const weekStart = toISODate(currentMonday);

  // Update header
  document.getElementById('weekLabel').textContent = formatWeekLabel(currentMonday);

  // Build grid structure
  buildGrid();

  // Populate modal day selects
  populateDaySelects();

  // Ensure recurring events exist
  await ensureRecurringEvents(weekStart);

  // Fetch all events for this week
  const { data, error } = await sb.from('planner_events')
    .select('*')
    .eq('week_start', weekStart)
    .order('start_time');

  if (error) {
    console.error('Supabase error:', error);
    toast('Error loading events — check console');
    return;
  }

  weekEvents = data || [];

  // Render events
  weekEvents.forEach(renderEvent);

  // Free time hints
  renderFreeTimeHints();

  // Now line
  startNowLine();

  // Default scroll to 8 AM
  scrollToDefault();
}

// ── AI PLANNING ASSISTANT (Local Smart Engine) ──
// Future: swap this with a real API call when a proxy/serverless function is set up.
// AI can return structured JSON action { action: 'add_event', ... }
// and the calendar will intercept and auto-drop the block with a confirmation prompt.

function analyzeSchedule() {
  const visible = weekEvents.filter(e => !e.is_hidden);

  // Build per-day timeline: array of { start (mins), end (mins), title, category }
  const days = Array.from({ length: 7 }, () => []);
  visible.forEach(ev => {
    const { h: sh, m: sm } = parseTime(ev.start_time);
    const { h: eh, m: em } = parseTime(ev.end_time);
    days[ev.day_index].push({
      start: sh * 60 + sm, end: eh * 60 + em,
      title: ev.title, category: ev.category,
    });
  });
  days.forEach(d => d.sort((a, b) => a.start - b.start));

  // Find free slots (between 7 AM and 11 PM, gaps >= 60 min)
  const FREE_START = 7 * 60, FREE_END = 23 * 60, MIN_GAP = 60;
  const freeSlots = [];
  for (let di = 0; di < 7; di++) {
    const evs = days[di];
    let cursor = FREE_START;
    evs.forEach(ev => {
      if (ev.start > cursor && ev.start - cursor >= MIN_GAP) {
        freeSlots.push({ day: di, from: cursor, to: ev.start });
      }
      cursor = Math.max(cursor, ev.end);
    });
    if (FREE_END - cursor >= MIN_GAP) {
      freeSlots.push({ day: di, from: cursor, to: FREE_END });
    }
  }

  // Detect conflicts (overlapping events on same day)
  const conflicts = [];
  for (let di = 0; di < 7; di++) {
    const evs = days[di];
    for (let i = 0; i < evs.length - 1; i++) {
      if (evs[i].end > evs[i + 1].start) {
        conflicts.push({ day: di, a: evs[i], b: evs[i + 1] });
      }
    }
  }

  // Count categories
  const catCounts = {};
  visible.forEach(ev => { catCounts[ev.category] = (catCounts[ev.category] || 0) + 1; });

  // Busiest / freest days
  const dayLoad = days.map(d => d.reduce((sum, ev) => sum + (ev.end - ev.start), 0));
  const busiestIdx = dayLoad.indexOf(Math.max(...dayLoad));
  const freestIdx = dayLoad.indexOf(Math.min(...dayLoad));

  return { days, freeSlots, conflicts, catCounts, dayLoad, busiestIdx, freestIdx };
}

function minsToTimeStr(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}${m ? ':' + String(m).padStart(2, '0') : ''} ${ampm}`;
}

function freeSlotStr(slot) {
  return `${DAY_NAMES_FULL[slot.day]} ${minsToTimeStr(slot.from)}–${minsToTimeStr(slot.to)}`;
}

// ── MONTH DATA FETCHER (for AI) ──
async function fetchMonthEvents(monthDate) {
  // If we already have monthEvents cached for this month, reuse them
  if (monthEvents.length > 0 && currentView === 'month') return monthEvents;

  const { gridStart, gridEnd } = getMonthGridRange(monthDate);
  const mondays = getMondaysInRange(gridStart, gridEnd);

  const { data, error } = await sb.from('planner_events')
    .select('*')
    .in('week_start', mondays)
    .order('start_time');

  if (error) { console.error('Month fetch error:', error); return []; }
  return (data || []).filter(e => !e.is_hidden);
}

function analyzeMonthEvents(events, monthDate) {
  const m = monthDate.getMonth();
  const y = monthDate.getFullYear();
  // Filter to only days actually in this month
  const inMonth = events.filter(e => {
    if (e.is_hidden) return false;
    const ws = new Date(e.week_start + 'T00:00:00');
    const evDate = addDays(ws, e.day_index);
    return evDate.getMonth() === m && evDate.getFullYear() === y;
  });

  // Hours per category
  const catHours = {};
  const catShifts = {};
  const catDetails = {};
  inMonth.forEach(ev => {
    const { h: sh, m: sm } = parseTime(ev.start_time);
    const { h: eh, m: em } = parseTime(ev.end_time);
    const hrs = ((eh * 60 + em) - (sh * 60 + sm)) / 60;
    const cat = ev.category;
    catHours[cat] = (catHours[cat] || 0) + hrs;
    catShifts[cat] = (catShifts[cat] || 0) + 1;
    if (!catDetails[cat]) catDetails[cat] = [];
    const ws = new Date(ev.week_start + 'T00:00:00');
    const evDate = addDays(ws, ev.day_index);
    catDetails[cat].push({
      date: evDate,
      hours: hrs,
      title: ev.title,
      start: ev.start_time,
      end: ev.end_time,
    });
  });

  const totalHours = Object.values(catHours).reduce((a, b) => a + b, 0);
  const totalEvents = inMonth.length;

  return { inMonth, catHours, catShifts, catDetails, totalHours, totalEvents };
}

// Category keyword map for natural language matching
const CAT_KEYWORDS = {
  kwik_trip: /\b(kt|kwik\s*trip|gas\s*station|convenience)\b/,
  bbs:       /\b(bbs|agency|work)\b/,
  bowling:   /\b(bowl(ing)?|league)\b/,
  movie:     /\b(movie|film|cinema|theatre|theater)\b/,
  gym:       /\b(gym|workout|exercise|lift|train|fitness)\b/,
  yoga:      /\b(yoga|stretch|meditat)\b/,
  family:    /\b(family|fam)\b/,
};

function detectCategory(query) {
  for (const [cat, regex] of Object.entries(CAT_KEYWORDS)) {
    if (regex.test(query)) return cat;
  }
  return null;
}

async function askAI() {
  const input = document.getElementById('aiIn');
  const query = input.value.trim().toLowerCase();
  if (!query) return;

  const respEl = document.getElementById('aiResp');
  respEl.style.display = 'block';
  respEl.textContent = '';
  input.value = '';

  // Detect if this is a month-level question
  const isMonthQ = /month|total\s*hours|how\s*many\s*hours|how\s*much\s*time|hours.*(?:booked|scheduled|worked|logged)|shifts?\s*this|paycheck|pay\s*period|earnings/.test(query);
  const detectedCat = detectCategory(query);

  let reply = '';

  // ── MONTH-LEVEL QUERIES ──
  if (isMonthQ) {
    respEl.textContent = '🐺 Crunching the numbers...';
    const monthDate = currentView === 'month' ? currentMonth : new Date(currentMonday.getFullYear(), currentMonday.getMonth(), 1);
    const mEvents = await fetchMonthEvents(monthDate);
    const mInfo = analyzeMonthEvents(mEvents, monthDate);
    const monthName = MONTH_NAMES_FULL[monthDate.getMonth()];

    if (detectedCat && mInfo.catHours[detectedCat]) {
      const cat = CATEGORIES[detectedCat] || CATEGORIES.other;
      const hrs = mInfo.catHours[detectedCat];
      const shifts = mInfo.catShifts[detectedCat];
      const details = mInfo.catDetails[detectedCat] || [];

      // Build shift breakdown
      const breakdown = details.map(d => {
        const dayName = DAY_NAMES_FULL[d.date.getDay() === 0 ? 6 : d.date.getDay() - 1];
        return `  • ${MONTH_NAMES[d.date.getMonth()]} ${d.date.getDate()} (${dayName}): ${fmtTime(d.start)}–${fmtTime(d.end)} (${d.hours.toFixed(1)}h)`;
      }).join('\n');

      reply = `${cat.icon} ${monthName} ${cat.label} Report, Roomie!\n\n` +
        `  📊 ${shifts} shift${shifts !== 1 ? 's' : ''} · ${hrs.toFixed(1)} total hours\n` +
        `  ⏱️ Average: ${(hrs / shifts).toFixed(1)}h per shift\n\n` +
        `Shift breakdown:\n${breakdown}\n\n` +
        `Keep grinding, Roomie! 🐺💜`;
    } else if (detectedCat && !mInfo.catHours[detectedCat]) {
      const cat = CATEGORIES[detectedCat] || CATEGORIES.other;
      reply = `${cat.icon} No ${cat.label} events found in ${monthName}, Roomie! If that's wrong, make sure they're added via Quick Add. 🐺`;
    } else {
      // General month summary
      const catLines = Object.entries(mInfo.catHours)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, hrs]) => {
          const c = CATEGORIES[cat] || CATEGORIES.other;
          const shifts = mInfo.catShifts[cat];
          return `  ${c.icon} ${c.label}: ${hrs.toFixed(1)}h (${shifts} event${shifts !== 1 ? 's' : ''})`;
        }).join('\n');

      reply = `🐺 ${monthName} Overview, Roomie!\n\n` +
        `  📊 ${mInfo.totalEvents} total events · ${mInfo.totalHours.toFixed(1)} hours booked\n\n` +
        `By category:\n${catLines}\n\n` +
        `Ask me about a specific one — like "KT hours this month" or "how many bowling nights?" 💜✨`;
    }

    respEl.textContent = '';
  }
  // ── CATEGORY HOURS (week-level, e.g. "how many KT shifts this week") ──
  else if (detectedCat && /how\s*many|count|shifts?|hours|times/.test(query)) {
    const cat = CATEGORIES[detectedCat] || CATEGORIES.other;
    const catEvs = weekEvents.filter(e => e.category === detectedCat && !e.is_hidden);
    if (catEvs.length === 0) {
      reply = `${cat.icon} No ${cat.label} events this week, Roomie! Want to add one? 🐺`;
    } else {
      let totalMins = 0;
      const lines = catEvs.map(e => {
        const { h: sh, m: sm } = parseTime(e.start_time);
        const { h: eh, m: em } = parseTime(e.end_time);
        const mins = (eh * 60 + em) - (sh * 60 + sm);
        totalMins += mins;
        return `  • ${DAY_NAMES_FULL[e.day_index]}: ${fmtTime(e.start_time)}–${fmtTime(e.end_time)} (${(mins/60).toFixed(1)}h)`;
      }).join('\n');
      reply = `${cat.icon} ${cat.label} this week, Roomie!\n\n` +
        `${lines}\n\n` +
        `  📊 ${catEvs.length} shift${catEvs.length !== 1 ? 's' : ''} · ${(totalMins/60).toFixed(1)} total hours\n\n` +
        `Want the monthly total? Ask "KT hours this month"! 🐺💜`;
    }
  }
  // ── WEEK-LEVEL QUERIES (existing logic) ──
  else {
    const info = analyzeSchedule();

    // "when am I free" / "free time" / "open slots" / "availability"
    if (/free|open|avail|slot|gap/.test(query)) {
      if (info.freeSlots.length === 0) {
        reply = '🐺 Whoa Roomie, you are BOOKED this week! No gaps over an hour. Maybe hide a BBS block if you need breathing room? 💜';
      } else {
        const top = info.freeSlots.slice(0, 5).map(s => '  • ' + freeSlotStr(s)).join('\n');
        reply = `✨ Here are your best open windows this week, Roomie!\n\n${top}\n\n${info.freeSlots.length > 5 ? `...and ${info.freeSlots.length - 5} more slots! ` : ''}You've got this! 🐺💜`;
      }
    }
    // "best night for movie" / "when to watch"
    else if (/movie|watch|film|cinema|theatre/.test(query)) {
      const eveningSlots = info.freeSlots.filter(s => s.from >= 17 * 60 && (s.to - s.from) >= 150);
      if (eveningSlots.length === 0) {
        reply = '🎬 Evenings are pretty packed this week, Roomie! You might need to shuffle something around for movie night. Weekends might be your best bet! 🐺';
      } else {
        const best = eveningSlots.slice(0, 3).map(s => '  • ' + freeSlotStr(s)).join('\n');
        reply = `🎬 Best movie night options, Roomie!\n\n${best}\n\nPlenty of time for popcorn AND previews! 🍿✨`;
      }
    }
    // "gym" / "workout" / "exercise" / "fit a gym"
    else if (/gym|workout|exercise|lift|train|fitness/.test(query)) {
      const gymSlots = info.freeSlots.filter(s => (s.to - s.from) >= 60 && s.to <= 21 * 60);
      if (gymSlots.length === 0) {
        reply = '💪 Tough to squeeze a workout in this week — things are packed! Maybe a quick morning session before 9? 🐺';
      } else {
        const best = gymSlots.slice(0, 3).map(s => '  • ' + freeSlotStr(s)).join('\n');
        reply = `💪 Great gym windows this week, Roomie!\n\n${best}\n\nGet those gains! 🐺✨`;
      }
    }
    // "yoga" / "stretch" / "relax"
    else if (/yoga|stretch|relax|meditat/.test(query)) {
      const morningSlots = info.freeSlots.filter(s => s.from < 12 * 60 && (s.to - s.from) >= 60);
      const anySlots = morningSlots.length ? morningSlots : info.freeSlots.filter(s => (s.to - s.from) >= 60);
      if (anySlots.length === 0) {
        reply = '🧘 This week is pretty full, Roomie — but even 15 minutes of stretching at home counts! 💜';
      } else {
        const best = anySlots.slice(0, 3).map(s => '  • ' + freeSlotStr(s)).join('\n');
        reply = `🧘 Perfect yoga windows, Roomie!\n\n${best}\n\nNamaste and slay! 🐺✨`;
      }
    }
    // Specific day questions
    else if (/monday|tuesday|wednesday|thursday|friday|saturday|sunday/.test(query)) {
      const dayMatch = query.match(/monday|tuesday|wednesday|thursday|friday|saturday|sunday/);
      const di = DAY_NAMES_FULL.findIndex(d => d.toLowerCase() === dayMatch[0]);
      const dayEvs = weekEvents.filter(e => e.day_index === di && !e.is_hidden);
      const dayFree = info.freeSlots.filter(s => s.day === di);

      if (dayEvs.length === 0) {
        reply = `✨ ${DAY_NAMES_FULL[di]} is wide open, Roomie! A blank canvas — fill it with something fun! 🐺💜`;
      } else {
        const evList = dayEvs.map(e => {
          const cat = CATEGORIES[e.category] || CATEGORIES.other;
          return `  • ${cat.icon} ${e.title} (${fmtTime(e.start_time)}–${fmtTime(e.end_time)})`;
        }).join('\n');
        const freeList = dayFree.length
          ? '\n\nFree windows:\n' + dayFree.map(s => '  • ' + minsToTimeStr(s.from) + '–' + minsToTimeStr(s.to)).join('\n')
          : '\n\nNo major gaps — it\'s a full day!';
        reply = `🐺 Here's ${DAY_NAMES_FULL[di]}, Roomie!\n\n${evList}${freeList}\n\n${dayEvs.length >= 3 ? 'Busy day — pace yourself! 💜' : 'Solid lineup! ✨'}`;
      }
    }
    // "conflict" / "overlap"
    else if (/conflict|overlap|double|clash/.test(query)) {
      if (info.conflicts.length === 0) {
        reply = '✨ No conflicts this week — your schedule is clean, Roomie! 🐺💜';
      } else {
        const cList = info.conflicts.map(c =>
          `  ⚠️ ${DAY_NAMES_FULL[c.day]}: "${c.a.title}" overlaps with "${c.b.title}"`
        ).join('\n');
        reply = `🐺 Heads up, Roomie — found some overlaps!\n\n${cList}\n\nMight want to adjust those! 💜`;
      }
    }
    // "busiest" / "packed"
    else if (/busiest|packed|heaviest|fullest|most busy/.test(query)) {
      const hours = (info.dayLoad[info.busiestIdx] / 60).toFixed(1);
      reply = `🐺 ${DAY_NAMES_FULL[info.busiestIdx]} is your busiest day with ~${hours} hours scheduled! ${DAY_NAMES_FULL[info.freestIdx]} is your lightest. Balance is key, Roomie! ✨💜`;
    }
    // "summary" / "overview" / "how's my week"
    else if (/summary|overview|how.*(week|schedule)|recap/.test(query)) {
      const totalHours = (info.dayLoad.reduce((a, b) => a + b, 0) / 60).toFixed(1);
      const totalEvents = weekEvents.filter(e => !e.is_hidden).length;
      const freeCount = info.freeSlots.length;
      const hasGym = info.catCounts.gym || 0;
      const hasYoga = info.catCounts.yoga || 0;

      reply = `🐺 Week at a glance, Roomie!\n\n` +
        `  📊 ${totalEvents} events · ~${totalHours} hours scheduled\n` +
        `  🔥 Busiest: ${DAY_NAMES_FULL[info.busiestIdx]}\n` +
        `  🌿 Lightest: ${DAY_NAMES_FULL[info.freestIdx]}\n` +
        `  🕐 ${freeCount} free slot${freeCount !== 1 ? 's' : ''} (1hr+)\n` +
        `  ${info.conflicts.length ? '⚠️ ' + info.conflicts.length + ' conflict(s) detected!' : '✅ No conflicts!'}\n` +
        `${!hasGym && !hasYoga ? '\n💡 No gym or yoga this week — maybe add one? Self-care matters! ' : ''}` +
        `\n\nYou\'re doing amazing! 💜✨`;
    }
    // "weekend"
    else if (/weekend/.test(query)) {
      const satEvs = weekEvents.filter(e => e.day_index === 5 && !e.is_hidden);
      const sunEvs = weekEvents.filter(e => e.day_index === 6 && !e.is_hidden);
      const satFree = info.freeSlots.filter(s => s.day === 5);
      const sunFree = info.freeSlots.filter(s => s.day === 6);

      reply = `🐺 Weekend report, Roomie!\n\n` +
        `Saturday: ${satEvs.length ? satEvs.length + ' event(s)' : 'Wide open! 🎉'} · ${satFree.length} free slot(s)\n` +
        `Sunday: ${sunEvs.length ? sunEvs.length + ' event(s)' : 'Wide open! 🎉'} · ${sunFree.length} free slot(s)\n\n` +
        `${satEvs.length + sunEvs.length === 0 ? 'Whole weekend is yours — live it up! 🐺✨' : 'Enjoy the downtime between things! 💜✨'}`;
    }
    // Default / catch-all
    else {
      const freeCount = info.freeSlots.length;
      const topFree = info.freeSlots.slice(0, 3).map(s => '  • ' + freeSlotStr(s)).join('\n');
      reply = `🐺 Hey Roomie! Here's what I see this week:\n\n` +
        `${freeCount} free slot${freeCount !== 1 ? 's' : ''} of 1hr+. Your lightest day is ${DAY_NAMES_FULL[info.freestIdx]}.\n` +
        `${info.conflicts.length ? '⚠️ ' + info.conflicts.length + ' overlap(s) to check!\n' : ''}` +
        `${topFree ? '\nTop open windows:\n' + topFree + '\n' : ''}` +
        `\nTry asking: "KT hours this month", "How does Thursday look?", or "Best night for a movie?" 💜✨`;
    }
  }

  // Typewriter effect
  respEl.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    respEl.textContent += reply[i++];
    if (i >= reply.length) clearInterval(interval);
  }, 12);
}

// Future: AI can return structured JSON action { action: 'add_event', ... }
// and the calendar will intercept and auto-drop the block with a confirmation prompt.

// ── MONTH VIEW ──
const MONTH_NAMES_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MAX_PILLS = 4;

function getMonthGridRange(monthDate) {
  // First day of the month
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  // Last day of the month
  const last = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
  // Grid starts on the Monday on or before the 1st
  const gridStart = getMondayOf(first);
  // Grid ends on the Sunday on or after the last day
  let gridEnd = new Date(last);
  const endDay = gridEnd.getDay();
  if (endDay !== 0) gridEnd = addDays(gridEnd, 7 - endDay);
  return { gridStart, gridEnd };
}

function getMondaysInRange(start, end) {
  const mondays = [];
  let d = new Date(start);
  while (d <= end) {
    mondays.push(toISODate(d));
    d = addDays(d, 7);
  }
  return mondays;
}

async function loadMonth() {
  const { gridStart, gridEnd } = getMonthGridRange(currentMonth);
  const mondays = getMondaysInRange(gridStart, gridEnd);

  // Update header label
  document.getElementById('weekLabel').textContent =
    `${MONTH_NAMES_FULL[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;

  // Ensure recurring events for each week in range
  for (const mon of mondays) {
    await ensureRecurringEvents(mon);
  }

  // Fetch all events across the month's weeks
  const { data, error } = await sb.from('planner_events')
    .select('*')
    .in('week_start', mondays)
    .order('start_time');

  if (error) {
    console.error('Supabase error:', error);
    toast('Error loading month — check console');
    return;
  }

  monthEvents = data || [];
  renderMonthGrid(gridStart, gridEnd);
}

function renderMonthGrid(gridStart, gridEnd) {
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';

  // Day-of-week headers
  const hdrLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  hdrLabels.forEach((lbl, i) => {
    const hdr = document.createElement('div');
    hdr.className = 'month-hdr' + (i >= 5 ? ' wknd' : '');
    hdr.textContent = lbl;
    grid.appendChild(hdr);
  });

  // Day cells
  let d = new Date(gridStart);
  const thisMonth = currentMonth.getMonth();
  const now = new Date();

  while (d <= gridEnd) {
    const cell = document.createElement('div');
    const isOther = d.getMonth() !== thisMonth;
    const isTodayCell = isToday(d);
    const dayOfWeek = d.getDay();
    const isWknd = dayOfWeek === 0 || dayOfWeek === 6;

    cell.className = 'month-cell'
      + (isOther ? ' other-month' : '')
      + (isTodayCell ? ' today' : '')
      + (isWknd ? ' weekend' : '');

    // Date number
    const dateEl = document.createElement('div');
    dateEl.className = 'month-cell-date';
    dateEl.textContent = d.getDate();
    cell.appendChild(dateEl);

    // Find events for this day
    const cellMonday = getMondayOf(d);
    const cellMondayStr = toISODate(cellMonday);
    const cellDayIndex = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    const dayEvs = monthEvents.filter(e =>
      e.week_start === cellMondayStr && e.day_index === cellDayIndex && !e.is_hidden
    );

    // Render event pills
    const showCount = Math.min(dayEvs.length, MAX_PILLS);
    for (let i = 0; i < showCount; i++) {
      const ev = dayEvs[i];
      const cat = CATEGORIES[ev.category] || CATEGORIES.other;
      const pill = document.createElement('div');
      pill.className = 'month-pill';
      pill.innerHTML = `<span class="month-pill-dot" style="background:${cat.bg}"></span>${cat.icon} ${ev.title}`;
      cell.appendChild(pill);
    }
    if (dayEvs.length > MAX_PILLS) {
      const more = document.createElement('div');
      more.className = 'month-more';
      more.textContent = `+${dayEvs.length - MAX_PILLS} more`;
      cell.appendChild(more);
    }

    // Click → jump to that week
    const clickDate = new Date(d);
    cell.addEventListener('click', () => {
      currentMonday = getMondayOf(clickDate);
      currentView = 'week';
      switchView();
    });

    grid.appendChild(cell);
    d = addDays(d, 1);
  }
}

// ── VIEW SWITCHING ──
function switchView() {
  const weekToggle = document.getElementById('vtWeek');
  const monthToggle = document.getElementById('vtMonth');
  const plannerScroll = document.getElementById('plannerScroll');
  const monthWrap = document.getElementById('monthWrap');

  if (currentView === 'week') {
    weekToggle.classList.add('active');
    monthToggle.classList.remove('active');
    plannerScroll.style.display = '';
    monthWrap.style.display = 'none';
    loadWeek();
  } else {
    weekToggle.classList.remove('active');
    monthToggle.classList.add('active');
    plannerScroll.style.display = 'none';
    monthWrap.style.display = '';
    // Sync currentMonth from currentMonday
    currentMonth = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), 1);
    loadMonth();
  }
}

// ── NAVIGATION ──
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentView === 'week') {
    currentMonday = addDays(currentMonday, -7);
    loadWeek();
  } else {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
    loadMonth();
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentView === 'week') {
    currentMonday = addDays(currentMonday, 7);
    loadWeek();
  } else {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
    loadMonth();
  }
});

document.getElementById('todayBtn').addEventListener('click', () => {
  if (currentView === 'week') {
    currentMonday = getMondayOf(new Date());
    loadWeek();
    setTimeout(() => {
      const now = new Date();
      scrollToHour(now.getHours(), 1.5);
    }, 100);
  } else {
    currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    loadMonth();
  }
});

document.getElementById('vtWeek').addEventListener('click', () => {
  if (currentView === 'week') return;
  currentView = 'week';
  switchView();
});

document.getElementById('vtMonth').addEventListener('click', () => {
  if (currentView === 'month') return;
  currentView = 'month';
  switchView();
});

// AI input Enter key
document.getElementById('aiIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') askAI();
});
document.getElementById('aiSendBtn').addEventListener('click', askAI);

// ── INIT ──
(async () => {
  try {
    await loadWeek();
  } catch (err) {
    console.error('Init error:', err);
    toast('Something went wrong loading the planner');
  } finally {
    document.getElementById('loader').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('app').style.display = '';
      // Scroll AFTER app becomes visible (display:none resets scrollTop)
      requestAnimationFrame(() => scrollToDefault());
    }, 380);
  }
})();
