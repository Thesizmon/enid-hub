<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F0A1E">
<title>Year 30 🐺 · Command Center</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   YEAR 30 — Design tokens (dark base + pink/purple/blue accents)
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg:        #0F0A1E;
  --bg-2:      #150E2B;
  --card:      rgba(255,255,255,0.045);
  --card-brd:  rgba(255,255,255,0.09);
  --pink:      #E84EA0;
  --purple:    #A855F7;
  --blue:      #4F8DF9;
  --cyan:      #38BDF8;
  --mint:      #6EE7B7;
  --amber:     #F59E0B;
  --text:      #F3EEFF;
  --sub:       #A79CC4;
  --faint:     #6F6690;
  --grad:      linear-gradient(135deg, #E84EA0 0%, #A855F7 50%, #4F8DF9 100%);
  --grad-soft: linear-gradient(135deg, rgba(232,78,160,.16), rgba(79,141,249,.14));
  --radius:    20px;
  --tap:       48px;   /* minimum tap target */
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);
}
/* ambient gradient glow */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 45% at 12% 4%,  rgba(232,78,160,.20) 0%, transparent 55%),
    radial-gradient(ellipse 60% 45% at 92% 8%,  rgba(79,141,249,.18) 0%, transparent 55%),
    radial-gradient(ellipse 75% 55% at 50% 102%, rgba(168,85,247,.20) 0%, transparent 60%);
}

/* ═══════════════════════════════════════════════════════════════════
   Loader
   ═══════════════════════════════════════════════════════════════════ */
#enidLoader {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  transition: opacity .4s ease;
}
#enidLoader.hidden { opacity: 0; pointer-events: none; }
.loader-orb {
  width: 74px; height: 74px; border-radius: 50%;
  background: var(--grad);
  display: grid; place-items: center;
  font-size: 34px;
  box-shadow: 0 0 44px rgba(168,85,247,.55);
  animation: orbPulse 1.5s ease-in-out infinite;
}
@keyframes orbPulse {
  0%,100% { transform: scale(1);    box-shadow: 0 0 34px rgba(168,85,247,.45); }
  50%     { transform: scale(1.08); box-shadow: 0 0 58px rgba(232,78,160,.65); }
}
#enidLoaderText { color: var(--sub); font-size: 14px; letter-spacing: .3px; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════════
   Layout
   ═══════════════════════════════════════════════════════════════════ */
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 22px 18px 0; }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 12px var(--pink); }
.brand a { color: var(--sub); text-decoration: none; font-family: 'DM Sans'; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--card-brd); background: var(--card); }

/* hero — the emotional anchor (Day N lands here in slice 2) */
.hero {
  position: relative;
  border-radius: var(--radius);
  padding: 26px 22px;
  background: var(--grad-soft);
  border: 1px solid var(--card-brd);
  overflow: hidden;
  margin-bottom: 18px;
}
.hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--pink); margin-bottom: 2px; }
.hero .daynum {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; line-height: .92;
  font-size: clamp(66px, 22vw, 92px);
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  letter-spacing: -2px;
}
.hero .daylabel { font-family: 'Space Grotesk'; font-size: 17px; font-weight: 600; margin-top: 2px; }
.hero .daylabel .of { color: var(--sub); font-weight: 500; }
.hero .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--sub); font-size: 13.5px; margin-top: 12px; }
.hero .hero-meta .sep { color: var(--faint); }
.hero .hero-meta .note { color: var(--pink); font-weight: 600; }
/* thin year-progress bar (live mode only) */
.yearbar { margin-top: 16px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
.yearbar-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--grad); transition: width .8s cubic-bezier(.4,0,.2,1); }

/* generic card */
.card {
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--card-brd);
  padding: 18px;
  margin-bottom: 16px;
}
.card h2 { font-family: 'Space Grotesk'; font-size: 15px; font-weight: 600; letter-spacing: .3px; margin-bottom: 4px; }
.muted { color: var(--sub); font-size: 13.5px; line-height: 1.5; }

/* card header row */
.card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.done-count { font-family: 'Space Grotesk'; font-size: 14px; font-weight: 600; color: var(--sub); }
.done-count.all { color: var(--mint); }

/* habit checklist */
#habitList { display: flex; flex-direction: column; gap: 8px; }
.habit {
  display: flex; align-items: center; gap: 13px;
  width: 100%; min-height: var(--tap);
  padding: 11px 13px; border-radius: 15px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--card-brd);
  color: var(--text); font: inherit; text-align: left;
  cursor: pointer; user-select: none;
  transition: background .15s ease, border-color .15s ease, transform .08s ease;
}
.habit:active { transform: scale(.985); }
.habit .check {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--faint);
  display: grid; place-items: center;
  transition: all .18s cubic-bezier(.4,0,.2,1);
}
.habit .check svg { width: 15px; height: 15px; opacity: 0; transform: scale(.4); transition: all .18s cubic-bezier(.34,1.56,.64,1); }
.habit .emoji { font-size: 20px; flex: none; }
.habit .name  { flex: 1; font-size: 15px; font-weight: 500; }
.habit .cat   { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 3px 8px; border-radius: 7px; flex: none; }
.cat.health { color: #6EE7B7; background: rgba(110,231,183,.12); }
.cat.wealth { color: #FBBF24; background: rgba(251,191,36,.12); }
.cat.growth { color: #93C5FD; background: rgba(147,197,253,.12); }
.cat.social { color: #F9A8D4; background: rgba(249,168,212,.12); }
/* done state */
.habit.done { background: var(--grad-soft); border-color: rgba(232,78,160,.28); }
.habit.done .check { background: var(--grad); border-color: transparent; box-shadow: 0 0 14px rgba(232,78,160,.5); }
.habit.done .check svg { opacity: 1; transform: scale(1); }
.habit.done .name { color: var(--text); }
.habit.pending { opacity: .55; }
.habit-empty { color: var(--sub); font-size: 14px; padding: 8px 2px; }

/* daily score */
.score-main { display: flex; align-items: center; gap: 18px; }
.ring-wrap { position: relative; width: 96px; height: 96px; flex: none; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 9; }
.ring-fill { fill: none; stroke: url(#scoreGrad); stroke-width: 9; stroke-linecap: round;
             stroke-dasharray: 326.73; stroke-dashoffset: 326.73;
             transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1); }
.ring-num  { position: absolute; inset: 0; display: grid; place-items: center;
             font-family: 'Space Grotesk'; font-weight: 700; font-size: 29px; }
.score-info { flex: 1; }
.score-info h2 { margin-bottom: 3px; }
.score-sub { color: var(--sub); font-size: 13px; margin-bottom: 11px; }
.score-sub.manual { color: var(--amber); }
.adjust-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
              background: var(--card); border: 1px solid var(--card-brd);
              padding: 9px 16px; border-radius: 12px; cursor: pointer; min-height: 40px; }
.adjust-btn:active { transform: scale(.97); }
.score-editor { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--card-brd); }
.editor-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.editor-val { font-family: 'Space Grotesk'; font-weight: 700; font-size: 20px; }
.reset-btn { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--sub);
             background: none; border: 1px solid var(--card-brd);
             padding: 8px 13px; border-radius: 10px; cursor: pointer; min-height: 38px; }
/* range slider */
#scoreSlider { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; margin: 6px 0; }
#scoreSlider::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
#scoreSlider::-moz-range-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
#scoreSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px;
             border-radius: 50%; background: var(--grad); box-shadow: 0 0 12px rgba(232,78,160,.55); cursor: pointer; }
#scoreSlider::-moz-range-thumb { width: 24px; height: 24px; border: none; border-radius: 50%;
             background: var(--pink); box-shadow: 0 0 12px rgba(232,78,160,.55); cursor: pointer; }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
  transform: translate(-50%, 20px);
  background: #241938; border: 1px solid var(--card-brd);
  color: var(--text); font-size: 13.5px; font-weight: 500;
  padding: 11px 17px; border-radius: 13px; z-index: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
  opacity: 0; pointer-events: none; transition: all .28s ease; max-width: 88vw;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { border-color: rgba(251,113,133,.5); }

/* placeholder shimmer for upcoming slices */
.soon { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 13px; padding: 14px 0; }
.soon .tag { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--purple); border: 1px solid rgba(168,85,247,.3); padding: 3px 8px; border-radius: 8px; }

.footnote { text-align: center; color: var(--faint); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<!-- Loader -->
<div id="enidLoader">
  <div class="loader-orb">🐺</div>
  <div id="enidLoaderText">Waking up Year 30…</div>
</div>

<!-- App -->
<div id="app" hidden>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Year 30</div>
    <a href="index.html">🐺 Hub</a>
  </div>

  <div class="hero">

          <defs>
            <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="1">

              <stop offset="0.5" stop-color="#A855F7"/>
              <stop offset="1"   stop-color="#4F8DF9"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg"   cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-num" id="scoreNum">0</div>
      </div>

  <div class="card" id="habitsCard">

  </div>

  <div class="card">
    <h2>Coming next</h2>
    <div class="soon"><span class="tag">Slice 5</span> Streaks + grace days</div>
    <div class="soon"><span class="tag">Slice 6</span> Quick journal + mood</div>
    <div class="soon"><span class="tag">Slice 7</span> Add / edit / archive habits</div>
  </div>

  <div class="footnote">Year 30 begins July 20, 2026 🎂</div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SUPABASE  (verbatim from glowup.html — same project)
   ═══════════════════════════════════════════════════════════════════ */
const SUPA_URL = 'https://oebxxurgxvzjnunjaujh.supabase.co';
const SUPA_KEY = 'sb_publishable_x0QWqeNaNAFf7vN7Ky0Mzw_c_FMBAAP';
const USER_ID  = 'ENID';
const SB_HEADS = {
  'apikey':        SUPA_KEY,
  'Authorization': `Bearer ${SUPA_KEY}`,
  'Content-Type':  'application/json',
};

async function sbGet(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: SB_HEADS });
  return r.ok ? r.json() : [];
}
async function sbPost(table, body) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
    method: 'POST', headers: SB_HEADS, body: JSON.stringify(body),
  });
  return r.ok;
}
async function sbUpsert(table, body, conflict) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=${conflict}`, {
    method: 'POST',
    headers: { ...SB_HEADS, 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify(body),
  });
  return r.ok;
}

/* ═══════════════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════════════ */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function prettyDate(d = new Date()) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

/* ── Day N of Year 30 ──────────────────────────────────────────────
   Day 1 = July 20, 2026 (Simon's 30th birthday). Year 30 = 365 days.
   Date-only math at local midnight so timezones can't off-by-one us.  */
const YEAR30_START = new Date(2026, 6, 20);   // month is 0-indexed → 6 = July
const YEAR30_DAYS  = 365;
function computeDay() {
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((todayMid - YEAR30_START) / 86400000);
  if (diff < 0) {
    return { mode: 'countdown', daysUntil: -diff };
  }
  const dayN = diff + 1;                       // the 20th itself is Day 1
  return {
    mode: dayN > YEAR30_DAYS ? 'after' : 'live',
    dayN,
    pct: Math.min(100, (dayN / YEAR30_DAYS) * 100),
  };
}

function renderCounter() {
  const c = computeDay();
  const eyebrow = document.getElementById('heroEyebrow');
  const num     = document.getElementById('heroDayNum');
  const label   = document.getElementById('heroDayLabel');
  const note    = document.getElementById('heroNote');
  const bar      = document.getElementById('yearBar');
  const barFill = document.getElementById('yearBarFill');
  document.getElementById('heroDate').textContent = prettyDate();

  if (c.mode === 'countdown') {
    eyebrow.textContent = 'Countdown';
    num.textContent = c.daysUntil;
    label.innerHTML = `day${c.daysUntil === 1 ? '' : 's'} <span class="of">until Year 30 begins</span>`;
    note.textContent = c.daysUntil === 1 ? 'Tomorrow. 🎂' : 'Day 1 = July 20 🎂';
    bar.hidden = true;
  } else if (c.mode === 'live') {
    eyebrow.textContent = 'Year 30';
    num.textContent = c.dayN;
    label.innerHTML = `Day ${c.dayN} <span class="of">of ${YEAR30_DAYS}</span>`;
    note.textContent = `${YEAR30_DAYS - c.dayN} days left to make it count`;
    bar.hidden = false;
    requestAnimationFrame(() => { barFill.style.width = c.pct + '%'; });
  } else { // after — the full year is done
    eyebrow.textContent = 'Year 30 · complete';
    num.textContent = YEAR30_DAYS;
    label.innerHTML = `Day ${YEAR30_DAYS} <span class="of">— you made it 👑</span>`;
    note.textContent = 'A full year, counted.';
    bar.hidden = false;
    requestAnimationFrame(() => { barFill.style.width = '100%'; });
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, isErr = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

/* ═══════════════════════════════════════════════════════════════════
   Habit checklist  (writes to y30_habit_logs, keyed habit_id+date)
   ═══════════════════════════════════════════════════════════════════ */
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let HABITS = [];              // active habit definitions
let DONE   = new Set();       // habit_ids completed today
let busy   = new Set();       // habit_ids mid-save (guards double-taps)

async function loadHabits() {
  const list = document.getElementById('habitList');
  try {
    const [habits, logs, days] = await Promise.all([
      sbGet(`y30_habits?user_id=eq.${USER_ID}&active=eq.true&select=id,name,icon,category,sort_order&order=sort_order`),
      sbGet(`y30_habit_logs?user_id=eq.${USER_ID}&date=eq.${todayStr()}&completed=eq.true&select=habit_id`),
      sbGet(`y30_days?user_id=eq.${USER_ID}&date=eq.${todayStr()}&select=day_score`),
    ]);
    HABITS = habits;
    DONE = new Set(logs.map(l => l.habit_id));
    renderHabits();
    initScore(days[0]);
  } catch (err) {
    console.error('[Year30] loadHabits failed:', err);
    list.innerHTML = '<div class="habit-empty">Couldn\'t reach Supabase — pull to refresh.</div>';
  }
}

function renderHabits() {
  const list = document.getElementById('habitList');
  if (!HABITS.length) {
    list.innerHTML = '<div class="habit-empty">No active habits yet.</div>';
  } else {
    list.innerHTML = HABITS.map(h => {
      const done = DONE.has(h.id);
      return `<button class="habit ${done ? 'done' : ''}" data-id="${h.id}" aria-pressed="${done}">
        <span class="check">${CHECK_SVG}</span>
        <span class="emoji">${h.icon}</span>
        <span class="name">${h.name}</span>
        <span class="cat ${h.category}">${h.category}</span>
      </button>`;
    }).join('');
    list.querySelectorAll('.habit').forEach(btn =>
      btn.addEventListener('click', () => toggleHabit(btn.dataset.id)));
  }
  updateDoneCount();
}

function updateDoneCount() {
  const el = document.getElementById('doneCount');
  const n = DONE.size, total = HABITS.length;
  el.textContent = `${n} / ${total}`;
  el.classList.toggle('all', total > 0 && n === total);
}

async function toggleHabit(id) {
  if (busy.has(id)) return;                       // ignore taps mid-save
  busy.add(id);
  const wasDone = DONE.has(id);
  const nowDone = !wasDone;

  // optimistic UI
  if (nowDone) DONE.add(id); else DONE.delete(id);
  paintHabit(id, nowDone, true);
  updateDoneCount();

  const ok = await sbUpsert('y30_habit_logs', {
    user_id: USER_ID, habit_id: id, date: todayStr(), completed: nowDone,
  }, 'habit_id,date');

  busy.delete(id);
  if (ok) {
    paintHabit(id, nowDone, false);               // clear pending state
  } else {
    // revert on failure
    if (wasDone) DONE.add(id); else DONE.delete(id);
    paintHabit(id, wasDone, false);
    updateDoneCount();
    toast('Save failed — tap again', true);
  }
  syncScoreFromHabits();                           // auto score follows habits
}

function paintHabit(id, done, pending) {
  const btn = document.querySelector(`.habit[data-id="${id}"]`);
  if (!btn) return;
  btn.classList.toggle('done', done);
  btn.classList.toggle('pending', pending);
  btn.setAttribute('aria-pressed', String(done));
}

/* ═══════════════════════════════════════════════════════════════════
   Daily score  (writes day_score to y30_days, keyed user_id+date)
   Auto = % of habits done. Override pins a value until a habit is
   toggled again. Manual-vs-auto is inferred on load (saved ≠ auto).
   ═══════════════════════════════════════════════════════════════════ */
const CIRC = 2 * Math.PI * 52;   // ring circumference (r=52)
let DAY_SCORE   = 0;
let scoreManual = false;
let scoreSaveTimer;

function autoScore() {
  return HABITS.length ? Math.round((DONE.size / HABITS.length) * 100) : 0;
}

function initScore(dayRow) {
  const auto = autoScore();
  if (dayRow && dayRow.day_score != null) {
    DAY_SCORE = dayRow.day_score;
    scoreManual = DAY_SCORE !== auto;   // heuristic: differs from auto ⇒ overridden
  } else {
    DAY_SCORE = auto;
    scoreManual = false;
  }
  renderScore();
}

function renderScore() {
  document.getElementById('ringFill').style.strokeDashoffset = CIRC * (1 - DAY_SCORE / 100);
  document.getElementById('scoreNum').textContent = DAY_SCORE;
  const sub = document.getElementById('scoreSub');
  sub.textContent = scoreManual ? 'Manual · you set this' : 'Auto · from your habits';
  sub.classList.toggle('manual', scoreManual);
  document.getElementById('scoreSlider').value = DAY_SCORE;
  document.getElementById('editorVal').textContent = DAY_SCORE;
  document.getElementById('resetBtn').style.visibility = scoreManual ? 'visible' : 'hidden';
}

async function saveScore() {
  const ok = await sbUpsert('y30_days',
    { user_id: USER_ID, date: todayStr(), day_score: DAY_SCORE }, 'user_id,date');
  if (!ok) toast('Score didn\'t save', true);
}
function saveScoreDebounced() {
  clearTimeout(scoreSaveTimer);
  scoreSaveTimer = setTimeout(saveScore, 400);
}

function syncScoreFromHabits() {
  if (scoreManual) return;            // override stays put until reset
  DAY_SCORE = autoScore();
  renderScore();
  saveScore();
}

function setupScoreControls() {
  const editor = document.getElementById('scoreEditor');
  document.getElementById('adjustBtn').addEventListener('click', () => {
    editor.hidden = !editor.hidden;
  });
  document.getElementById('scoreSlider').addEventListener('input', (e) => {
    DAY_SCORE = +e.target.value;
    scoreManual = true;
    renderScore();
    saveScoreDebounced();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    scoreManual = false;
    DAY_SCORE = autoScore();
    renderScore();
    saveScore();
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════════════════════════════ */
async function boot() {
  // the emotional anchor: Day N of Year 30 (countdown until July 20)
  renderCounter();

  // reveal the app, drop the loader
  document.getElementById('app').hidden = false;
  const loader = document.getElementById('enidLoader');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 450);

  // wire up the score controls, then load today's habits + score
  setupScoreControls();
  await loadHabits();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
